services:
  - type: web
    name: anicircle
    runtime: node
    buildCommand: apt-get update && apt-get install -y chromium-browser && npm install && npm run build && node build-server.mjs
    startCommand: node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
